[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attentive-ssm-pyro"
version = "0.1.0"
description = "A documented Pyro implementation of attentive state-space disease progression models"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3", "pyro-ppl==1.9.1", "numpy>=1.26,<3",
  "scipy>=1.11,<2", "scikit-learn>=1.4,<2"
]

[tool.setuptools.packages.find]
include = ["assm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
